name: Check and release
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Check and publish the version already recorded on this commit of the default branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-{1}', github.workflow, github.ref) || format('ci-{0}-{1}', github.workflow, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit

  sqlite-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ensure-ci-sqlite
      - name: Wrapper stdout, exit, and compile
        if: runner.os != 'Windows'
        run: |
          set -eu
          out=$(sh scripts/dev-node.sh -- node -e "process.stdout.write('wrapper-ok')")
          printf '%s\n' "$out" | grep -q wrapper-ok
          set +e
          sh scripts/dev-node.sh -- node -e "process.exit(7)"
          code=$?
          set -e
          test "$code" -eq 7
          sh scripts/dev-node.sh -- npm run compile
      - name: Wrapper exit and compile (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call scripts\dev-node.cmd -- node -e "process.stdout.write('wrapper-ok')"
          if errorlevel 1 exit /b 1
          call scripts\dev-node.cmd -- node -e "process.exit(7)"
          if not "%ERRORLEVEL%"=="7" exit /b 1
          call scripts\dev-node.cmd -- npm run compile
          if errorlevel 1 exit /b 1
      - run: npm test

  host-smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.125.0', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:host
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  version-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: decide
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release && 'true' || 'false' }}
        run: node --import tsx scripts/release-decision.ts

  package:
    needs: [check, sqlite-integration, host-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      vsix: ${{ steps.artifact.outputs.vsix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ensure-ci-sqlite
      - run: npm run package
      - run: npm run check-package
      - id: artifact
        run: |
          ver=$(node -p "require('./package.json').version")
          name="cursor-chat-transit-${ver}.vsix"
          cp "dist/cursor-chat-transit.vsix" "dist/${name}"
          (cd dist && sha256sum "$name" > SHA256SUMS)
          echo "name=cursor-chat-transit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "vsix=dist/${name}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.artifact.outputs.vsix }}
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  ci-result:
    name: CI required
    if: ${{ always() }}
    needs: [check, sqlite-integration, host-smoke, package, version-decision]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all validation jobs
        env:
          CHECK: ${{ needs.check.result }}
          CORE: ${{ needs.sqlite-integration.result }}
          HOST: ${{ needs.host-smoke.result }}
          PACKAGE: ${{ needs.package.result }}
          VERSION: ${{ needs.version-decision.result }}
        run: |
          for result in "$CHECK" "$CORE" "$HOST" "$PACKAGE" "$VERSION"; do
            test "$result" = success || exit 1
          done

  release:
    needs: [package, ci-result, version-decision]
    if: needs.version-decision.outputs.publish == 'true' && needs.package.result == 'success' && needs.ci-result.result == 'success' && needs.version-decision.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-publish-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download validated package from this run
        env:
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$ARTIFACT_NAME"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release-artifact
      - name: Verify package checksum
        working-directory: release-artifact
        run: sha256sum --check SHA256SUMS
      - name: Publish the recorded version
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: release-artifact
        run: node --import tsx scripts/publish-release.ts
